- hosts: all
  vars_files:
    - group_vars/all/vars.yml
    - "host_vars/{{ inventory_hostname }}.yml"
  pre_tasks:
    - name: Create aur_builder user for AUR
      become: yes
      ansible.builtin.user:
        name: aur_builder
        create_home: yes
        group: wheel

    - name: Allow aur_builder passwordless sudo for pacman
      become: yes
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/11-install-aur_builder
        line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
        create: yes
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Check whether paru is installed
      become: yes
      become_user: aur_builder
      ansible.builtin.command:
        cmd: paru --version
      register: paru_check
      changed_when: false
      failed_when: false

    - name: Install paru build dependencies
      become: yes
      community.general.pacman:
        name:
          - base-devel
          - git
        state: present
      when: paru_check.rc != 0

    - name: Clone paru
      become: yes
      become_user: aur_builder
      ansible.builtin.git:
        repo: https://aur.archlinux.org/paru.git
        dest: /home/aur_builder/paru
      when: paru_check.rc != 0

    - name: Build and install paru
      become: yes
      become_user: aur_builder
      ansible.builtin.command:
        cmd: makepkg -si --noconfirm
        chdir: /home/aur_builder/paru
      when: paru_check.rc != 0
  roles:
    - packages
    - git_repos
